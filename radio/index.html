<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>radio — sk8 studio</title>
    <meta name="description" content="studio vibes. music is our source code...playlists are our love language" />
    <link rel="canonical" href="https://sk8.studio/radio/" />
    <link rel="icon" href="/img/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/patrick-hand.woff2" />
    <link rel="stylesheet" href="/cover.css" />
    <script src="radio.js" type="module"></script>
  </head>

  <body>
    <a class="skip" href="#main">skip to the page</a>

    <header class="top">
      <a class="home" href="/" aria-label="sk8 studio, back to the cover">
        <img src="/img/bushsk8r-logo.png" alt="" width="36" height="48" />
        <span>sk8 studio</span>
      </a>
      <nav aria-label="site">
        <a href="/play/">play</a>
        <a href="/radio/" aria-current="page">radio</a>
        <a href="/collections/">crate</a>
      </nav>
    </header>

    <main id="main">
      <section class="hero solo">
        <div class="heroWords">
          <h1>radio</h1>
          <p class="lead">studio vibes</p>
          <p class="lead">music is our source code...playlists are our love language</p>
        </div>
      </section>

      <section class="radio" aria-labelledby="radioTitle">
        <h2 id="radioTitle" class="visually-hidden">on air</h2>
        <p class="radioLede">each maker airs one playlist at a time. the links open on other sites.</p>
        <p id="status" class="status" role="status">tuning in…</p>

        <!-- the dial: one button stop per channel on air. filled by radio.js -->
        <div class="dial" id="dial" hidden>
          <button class="dialStep" id="prev" type="button" aria-label="previous channel">◀</button>
          <div class="dialFace">
            <ol class="dialStops" id="stops" aria-label="channels on air"></ol>
          </div>
          <button class="dialStep" id="next" type="button" aria-label="next channel">▶</button>
          <p class="pixel dialSay" id="dialSay"></p>
          <p class="visually-hidden" id="dialLive" aria-live="polite"></p>
        </div>

        <article class="channel" id="channel" hidden aria-labelledby="channelName">
          <p class="pixel onAir"><span class="onAirLamp" aria-hidden="true"></span>on air</p>
          <h3 id="channelName" class="channelName"></h3>
          <p class="pixel channelMeta" id="channelMeta"></p>
          <p class="channelSay" id="channelSay" hidden></p>

          <div class="playlist">
            <h4 id="playlistTitle"></h4>
            <div id="links"></div>
          </div>

          <details class="why" id="why" hidden></details>
        </article>
      </section>
    </main>

  </body>
</html>
